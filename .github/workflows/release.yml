# v1.2.3 같은 태그를 push 하면 .deb 와 .snap 을 만들어 GitHub 릴리스에 올린다.
# 저장소 시크릿에 SNAPCRAFT_STORE_CREDENTIALS 가 있으면 Snap Store 에도 올린다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version in the metainfo file
        run: |
          version="$(packaging/version.sh)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in data/io.github.kimsunmin.StickyNotes.metainfo.xml"
            exit 1
          fi
      - run: python3 -m py_compile sticky_notes.py
      - run: packaging/build-deb.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/sticky-notes.deb --title "$GITHUB_REF_NAME" --generate-notes

  snap:
    needs: deb
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5
      - uses: snapcore/action-build@v1
        id: build
      - name: Add the snap to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: gh release upload "$GITHUB_REF_NAME" "$SNAP_FILE"
      - name: Publish to the Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
